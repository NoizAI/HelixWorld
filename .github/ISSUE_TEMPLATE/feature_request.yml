name: Feature request
description: Ask for a capability, integration, or release item
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        HelixWorld 1.0 is not open yet. Feature requests still matter — they shape the release and the work after it.
        Search existing issues before filing a new one.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Release (weights, code, paper, demo)
        - Real-time interaction / controls
        - Spatial audio / sound field
        - Multi-agent
        - Multi-person presence
        - Long-horizon consistency
        - Autonomous world evolution
        - Evaluation / metrics
        - Training / data
        - Integration (game, film, education, other)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, and who hits it?
      placeholder: e.g. We cannot use HelixWorld in a co-op prototype because there is only one listener.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should exist? Interface sketches are welcome; no need for a full design.
    validations:
      required: true
  - type: dropdown
    id: horizon
    attributes:
      label: When do you need this?
      options:
        - With the 1.0 open-source drop
        - Soon after 1.0
        - Research / later
        - Unsure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Links, papers, product constraints, hardware, anything else.
