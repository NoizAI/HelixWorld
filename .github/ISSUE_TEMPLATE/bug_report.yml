name: Bug report
description: Something wrong in this repository (docs, links, metadata)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Inference and weights are not released yet. Use this form for problems with the placeholder repo itself (README, license, templates). For new capabilities, file a feature request instead.
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      placeholder: Broken link, misleading status badge, missing license file, …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it be?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: File path, URL, or section heading.
